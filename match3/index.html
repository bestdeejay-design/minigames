<style>
:root{
  --clr-bg:#0A0A0F;--clr-bg-alt:#0E0E14;--clr-surface:#12121A;--clr-surface-hover:#1A1A24;
  --clr-text:#C7C7CC;--clr-heading:#F5F5F7;--clr-muted:#8E8E93;--clr-faint:#78787D;
  --clr-border:rgba(255,255,255,.06);--clr-border-hover:rgba(255,255,255,.1);

}
*{margin:0;padding:0;box-sizing:border-box;user-select:none;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;touch-action:none}
body{background:var(--clr-bg);color:var(--clr-text);font-family:'Inter',system-ui,-apple-system,sans-serif;display:flex;justify-content:center}
.hidden{display:none!important}
.noise{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:60;opacity:.025;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E")}
.grid-overlay{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0;background-image:linear-gradient(var(--clr-border) 1px,transparent 1px),linear-gradient(90deg,var(--clr-border) 1px,transparent 1px);background-size:60px 60px}
#app{width:100%;max-width:420px;height:100vh;height:100dvh;display:flex;flex-direction:column;position:relative;z-index:1;background:var(--clr-bg)}
/* Topbar */
#topbar{flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--clr-border);background:rgba(10,10,15,.7);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
#topbar .back{display:inline-flex;align-items:center;gap:6px;color:var(--clr-muted);text-decoration:none;font-size:.8rem;letter-spacing:.5px;transition:color .25s}
#topbar .back:hover{color:var(--clr-heading)}
#topbar .brand{font-size:.65rem;font-weight:600;letter-spacing:2.5px;text-transform:uppercase;color:var(--clr-faint)}
/* Welcome */
#welcome{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;overflow:auto}
.w-badge{display:inline-flex;padding:6px 16px;border:1px solid var(--clr-border);border-radius:20px;font-size:.62rem;color:var(--clr-muted);letter-spacing:2.5px;text-transform:uppercase;line-height:1}

.w-best{display:inline-flex;align-items:center;gap:8px;padding:8px 18px;border-radius:10px;background:var(--clr-surface);border:1px solid var(--clr-border);font-size:.8rem;color:var(--clr-text)}
.w-best b{color:var(--clr-accent);font-variant-numeric:tabular-nums}
#btn-play{margin-top:6px;padding:14px 64px;border:none;border-radius:12px;background:var(--clr-accent);color:#14100B;font-family:inherit;font-size:1rem;font-weight:700;letter-spacing:.5px;cursor:pointer;transition:filter .2s,transform .1s}
#btn-play:hover{filter:brightness(1.08)}

/* Game */
#game{display:flex;flex-direction:column;flex:1;overflow:hidden}
#stats{flex-shrink:0;display:grid;grid-template-columns:repeat(4,1fr);padding:10px 8px;background:var(--clr-surface);border-bottom:1px solid var(--clr-border)}
.stat{display:flex;flex-direction:column;align-items:center;gap:2px;padding:2px 4px;border-left:1px solid var(--clr-border);min-width:0}
.stat:first-child{border-left:none}
.stat-label{font-size:.56rem;letter-spacing:1.5px;text-transform:uppercase;color:var(--clr-faint);white-space:nowrap}

#progress-wrap{height:3px;background:var(--clr-bg-alt);overflow:hidden;flex-shrink:0}
#progress-fill{height:100%;background:linear-gradient(90deg,var(--clr-accent),#E8C9A0);width:0%;transition:width .3s}
#canvas-wrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:12px}
#gc{display:block;border-radius:12px;background:var(--clr-bg-alt);border:1px solid var(--clr-border);box-shadow:0 12px 40px rgba(0,0,0,.45)}
#bottom{display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));flex-shrink:0;border-top:1px solid var(--clr-border);background:rgba(10,10,15,.6)}

#bottom button:hover{background:var(--clr-surface-hover);border-color:var(--clr-border-hover);color:var(--clr-heading)}

/* Modal */
#modal{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:50;background:rgba(5,5,8,.8);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);padding:24px}
.modal-card{width:100%;max-width:320px;background:var(--clr-surface);border:1px solid var(--clr-border-hover);border-radius:16px;padding:28px 24px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;box-shadow:0 24px 80px rgba(0,0,0,.6)}
#modal-title{font-size:1.35rem;font-weight:600;color:var(--clr-heading)}
#modal-score{font-size:.9rem;color:var(--clr-muted);line-height:1.5}
.modal-actions{display:flex;gap:8px;width:100%;margin-top:8px}
#modal-btn,#modal-btn2{flex:1;padding:12px 16px;border-radius:10px;border:1px solid transparent;font-family:inherit;font-size:.9rem;font-weight:600;cursor:pointer;transition:filter .2s}
#modal-btn:active,#modal-btn2:active{transform:translateY(1px)}
.modal-win #modal-btn{background:var(--clr-accent2);color:#0E1410}
.modal-lose #modal-btn{background:var(--clr-danger);color:#170D0D}
.modal-ask #modal-btn{background:var(--clr-accent);color:#14100B}
#modal-btn2{background:transparent;border-color:var(--clr-border-hover);color:var(--clr-muted)}
.modal-win .modal-card{border-top:2px solid var(--clr-accent2)}
.modal-lose .modal-card{border-top:2px solid var(--clr-danger)}
.modal-ask .modal-card{border-top:2px solid var(--clr-accent)}

<div class="grid-overlay"></div>

<div id="app">
  <header id="topbar">
    <a class="back" href="../">← Каталог</a>

  </header>
  <div id="welcome">
    <span class="w-badge">AXIIOM · Мини-игры</span>
    <h1>Три в ряд</h1>
    <div class="gem-row" aria-hidden="true">
      <i style="background:#ff4444"></i><i style="background:#4488ff"></i><i style="background:#44cc44"></i><i style="background:#ffdd44"></i><i style="background:#cc44ff"></i><i style="background:#ff8844"></i>
    </div>
    <p>Меняйте камни местами, собирайте линии из трёх и более одинаковых, набирайте очки и проходите 15 уровней.</p>

      <canvas id="gc"></canvas>

      <div id="modal-title"></div>

      </div>

<script>
// ======================== CONSTANTS ========================
const LEVELS = [
  { grid:6, types:4, target:100, moves:30 },
  { grid:6, types:4, target:150, moves:28 },
  { grid:6, types:5, target:200, moves:30 },
  { grid:7, types:5, target:250, moves:30 },
  { grid:7, types:5, target:300, moves:28 },
  { grid:8, types:5, target:350, moves:30 },
  { grid:8, types:5, target:400, moves:28 },
  { grid:8, types:6, target:450, moves:30 },
  { grid:9, types:6, target:500, moves:30 },
  { grid:9, types:6, target:550, moves:28 },
  { grid:10,types:6, target:600, moves:30 },
  { grid:10,types:6, target:650, moves:28 },
  { grid:11,types:6, target:700, moves:30 },
  { grid:11,types:6, target:750, moves:28 },
  { grid:12,types:6, target:800, moves:30 }
];

const GEM_COLORS = [
  ['#ff4444','#cc0000'], // 0 red circle
  ['#4488ff','#0044cc'], // 1 blue square
  ['#44cc44','#008800'], // 2 green triangle
  ['#ffdd44','#ccaa00'], // 3 yellow diamond
  ['#cc44ff','#8800cc'], // 4 purple star
  ['#ff8844','#cc5500']  // 5 orange hexagon
];

const SCORE_3 = 10, SCORE_4 = 20, SCORE_5P = 30;
const SWAP_DURATION = 150, MATCH_DURATION = 200, FALL_DURATION = 180;
const SAVE_KEY = 'match3_progress';
const SND_KEY = 'match3_sound';

// ======================== DOM ========================
const canvas = document.getElementById('gc');
const ctx = canvas.getContext('2d');
const welcomeEl = document.getElementById('welcome');
const gameEl = document.getElementById('game');
const modalEl = document.getElementById('modal');
const modalTitle = document.getElementById('modal-title');
const modalScore = document.getElementById('modal-score');
const modalBtn = document.getElementById('modal-btn');
const modalBtn2 = document.getElementById('modal-btn2');
const levelNum = document.getElementById('level-num');
const totalScoreEl = document.getElementById('total-score');
const levelScoreEl = document.getElementById('level-score');
const movesLeftEl = document.getElementById('moves-left');
const progressFill = document.getElementById('progress-fill');

let cw, ch, cellSize, dpr = window.devicePixelRatio || 1;

// ======================== STATE ========================
let currentLevel = 0, totalScore = 0, levelScore = 0, movesLeft = 0;
let grid = [], gridSize = 0, gemTypes = 0;
let animState = 'idle'; // idle | swap | match | fall
let animType = '', animData = null, animStart = 0, animDuration = 0;
let selectedR = -1, selectedC = -1;
let soundOn = (localStorage.getItem(SND_KEY) !== '0'), levelTarget = 0;
let locked = false;

// ======================== AUDIO ========================
// Генерируем WAV на лету и играем через Audio — работает на iOS
let audioCtx = null;

function initAudio() {
  if (audioCtx) return;
  try {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
  } catch(e) {}
}

function beep(freq, dur, vol, sweep) {
  if (!soundOn) return;
  try {
    const sr = 22050, len = Math.floor(sr * dur), fade = Math.floor(sr * 0.003);
    const buf = new ArrayBuffer(44 + len * 2);
    const dv = new DataView(buf);
    const w = (s, o) => { for (let i = 0; i < s.length; i++) dv.setUint8(o + i, s.charCodeAt(i)); };
    w('RIFF', 0); dv.setUint32(4, 36 + len * 2, true); w('WAVE', 8);
    w('fmt ', 12); dv.setUint32(16, 16, true); dv.setUint16(20, 1, true); dv.setUint16(22, 1, true);
    dv.setUint32(24, sr, true); dv.setUint32(28, sr * 2, true);
    dv.setUint16(32, 2, true); dv.setUint16(34, 16, true);
    w('data', 36); dv.setUint32(40, len * 2, true);
    for (let i = 0; i < len; i++) {
      const t = i / sr, f = sweep ? freq + (sweep - freq) * (i / len) : freq;
      const s = Math.sin(2 * Math.PI * f * t) * 0.4 * vol;
      const env = Math.min(1, i / fade) * Math.min(1, (len - i) / fade);
      dv.setInt16(44 + i * 2, s * 32767 * env, true);
    }
    const a = new Audio(URL.createObjectURL(new Blob([buf], { type: 'audio/wav' })));
    a.volume = 0.7;
    a.play();
    setTimeout(() => URL.revokeObjectURL(a.src), dur * 1000 + 500);
  } catch (e) {}
}

function sndClick() { beep(880, 0.05, 0.3); }
function sndSwap() { beep(350, 0.12, 0.3, 700); }
function sndMatch() { beep(523, 0.12, 0.35); setTimeout(() => beep(659, 0.12, 0.35), 70); setTimeout(() => beep(784, 0.15, 0.35), 140); }
function sndBad() { beep(160, 0.2, 0.25); }
function sndWin() { beep(523, 0.2, 0.4); setTimeout(() => beep(659, 0.2, 0.4), 150); setTimeout(() => beep(784, 0.2, 0.4), 300); setTimeout(() => beep(1047, 0.35, 0.4), 450); }
function sndLose() { beep(400, 0.25, 0.3, 100); }

// ======================== SAVE/LOAD ========================
function saveGame() {
  localStorage.setItem(SAVE_KEY, JSON.stringify({
    level: currentLevel, totalScore, highScore: Math.max(totalScore, parseInt(localStorage.getItem(SAVE_KEY) ? JSON.parse(localStorage.getItem(SAVE_KEY)).highScore || 0 : 0))
  }));
}
function loadGame() {
  try {
    const d = JSON.parse(localStorage.getItem(SAVE_KEY));
    if (d && d.level !== undefined) { currentLevel = d.level; totalScore = d.totalScore || 0; }
  } catch(e){}
}
function getBest() {
  try { return (JSON.parse(localStorage.getItem(SAVE_KEY)) || {}).highScore || 0; } catch (e) { return 0; }
}

// ======================== GRID ========================
function initGrid() {
  grid = [];
  for (let r = 0; r < gridSize; r++) {
    grid[r] = [];
    for (let c = 0; c < gridSize; c++) {
      let t;
      do {
        t = Math.floor(Math.random() * gemTypes);
      } while (
        (r >= 2 && grid[r-1][c] === t && grid[r-2][c] === t) ||
        (c >= 2 && grid[r][c-1] === t && grid[r][c-2] === t)
      );
      grid[r][c] = t;
    }
  }
}

function findMatches() {
  const set = new Set();
  for (let r = 0; r < gridSize; r++) {
    let c = 0;
    while (c < gridSize) {
      const t = grid[r][c];
      if (t < 0) { c++; continue; }
      let len = 1;
      while (c + len < gridSize && grid[r][c+len] === t) len++;
      if (len >= 3) for (let i = 0; i < len; i++) set.add(r * gridSize + (c + i));
      c += len;
    }
  }
  for (let c = 0; c < gridSize; c++) {
    let r = 0;
    while (r < gridSize) {
      const t = grid[r][c];
      if (t < 0) { r++; continue; }
      let len = 1;
      while (r + len < gridSize && grid[r+len][c] === t) len++;
      if (len >= 3) for (let i = 0; i < len; i++) set.add((r + i) * gridSize + c);
      r += len;
    }
  }
  return [...set].map(v => ({ r: Math.floor(v / gridSize), c: v % gridSize }));
}

function hasValidMoves() {
  for (let r = 0; r < gridSize; r++) {
    for (let c = 0; c < gridSize; c++) {
      if (c + 1 < gridSize) {
        [grid[r][c], grid[r][c+1]] = [grid[r][c+1], grid[r][c]];
        if (findMatches().length) { [grid[r][c], grid[r][c+1]] = [grid[r][c+1], grid[r][c]]; return true; }
        [grid[r][c], grid[r][c+1]] = [grid[r][c+1], grid[r][c]];
      }
      if (r + 1 < gridSize) {
        [grid[r][c], grid[r+1][c]] = [grid[r+1][c], grid[r][c]];
        if (findMatches().length) { [grid[r][c], grid[r+1][c]] = [grid[r+1][c], grid[r][c]]; return true; }
        [grid[r][c], grid[r+1][c]] = [grid[r+1][c], grid[r][c]];
      }
    }
  }
  return false;
}

function shuffleGrid() {
  const flat = grid.flat().filter(v => v >= 0);
  for (let i = flat.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [flat[i], flat[j]] = [flat[j], flat[i]];
  }
  let idx = 0;
  for (let r = 0; r < gridSize; r++)
    for (let c = 0; c < gridSize; c++)
      grid[r][c] = flat[idx++];
  if (findMatches().length || !hasValidMoves()) shuffleGrid();
}

// ======================== ANIMATION ========================
function startAnim(type, data, duration, callback) {
  animState = 'anim';
  animType = type;
  animData = data;
  animDuration = duration;
  animStart = performance.now();
  animCallback = callback;
}

let animCallback = null;

function updateAnim() {
  if (animState !== 'anim') return;
  const elapsed = performance.now() - animStart;
  const raw = Math.min(elapsed / animDuration, 1);
  const t = raw < 1 ? raw * (2 - raw) : 1; // easeOutQuad
  animProgress = t;
  if (raw >= 1) {
    animState = 'idle';
    if (animCallback) { const cb = animCallback; animCallback = null; cb(); }
  }
}

let animProgress = 0;

// ======================== GAME FLOW ========================
function startLevel() {
  const lv = LEVELS[currentLevel];
  gridSize = lv.grid; gemTypes = lv.types; levelTarget = lv.target;
  movesLeft = lv.moves; levelScore = 0;
  initGrid();
  if (!hasValidMoves()) shuffleGrid();
  animState = 'idle'; animType = ''; animData = null; locked = false;
  selectedR = -1; selectedC = -1;
  modalEl.classList.add('hidden');
  gameEl.classList.remove('hidden');
  requestAnimationFrame(() => resizeCanvas());
  updateHUD();
}

function doSwap(r1, c1, r2, c2) {
  locked = true;
  [grid[r1][c1], grid[r2][c2]] = [grid[r2][c2], grid[r1][c1]];
  const matches = findMatches();
  if (matches.length === 0) {
    [grid[r1][c1], grid[r2][c2]] = [grid[r2][c2], grid[r1][c1]];
    startAnim('swap_back', { r1,c1,r2,c2 }, SWAP_DURATION, () => {
      sndBad(); locked = false;
    });
    return;
  }
  movesLeft--;
  sndSwap();
  updateHUD();
  startAnim('swap', { r1,c1,r2,c2 }, SWAP_DURATION, () => processMatches(matches));
}

function processMatches(prevMatches) {
  const matches = prevMatches || findMatches();
  if (!matches.length) { afterCascade(); return; }

  const pts = calcScore(matches);
  levelScore += pts; totalScore += pts;
  sndMatch();
  updateHUD();

  startAnim('match', { cells: matches }, MATCH_DURATION, () => {
    for (const { r, c } of matches) grid[r][c] = -1;
    const falls = applyGravity();
    fillEmpty();
    startAnim('fall', { falls }, FALL_DURATION, () => {
      processMatches(null);
    });
  });
}

function calcScore(matches) {
  const isMatch = {};
  for (const m of matches) isMatch[m.r * gridSize + m.c] = true;
  const used = new Set();
  let total = 0;
  // Horizontal lines
  for (let r = 0; r < gridSize; r++) {
    let c = 0;
    while (c < gridSize) {
      const t = grid[r][c];
      if (t < 0 || !isMatch[r * gridSize + c]) { c++; continue; }
      let len = 1;
      while (c + len < gridSize && grid[r][c + len] === t && isMatch[r * gridSize + c + len]) len++;
      if (len >= 3) {
        for (let i = 0; i < len; i++) used.add(r * gridSize + c + i);
        total += len === 3 ? SCORE_3 : len === 4 ? SCORE_4 : SCORE_5P;
      }
      c += len;
    }
  }
  // Vertical lines (skip cells already counted in horizontal)
  for (let c = 0; c < gridSize; c++) {
    let r = 0;
    while (r < gridSize) {
      const key = r * gridSize + c;
      const t = grid[r][c];
      if (t < 0 || !isMatch[key] || used.has(key)) { r++; continue; }
      let len = 1;
      while (r + len < gridSize && grid[r + len][c] === t && isMatch[(r + len) * gridSize + c]) len++;
      if (len >= 3) total += len === 3 ? SCORE_3 : len === 4 ? SCORE_4 : SCORE_5P;
      r += len;
    }
  }
  return total;
}

function afterCascade() {
  if (levelScore >= levelTarget) {
    const prevBest = getBest();
    saveGame();
    const rec = totalScore > prevBest;
    sndWin(); showModal(rec ? '🏆 Уровень пройден!' : '🎉 Уровень пройден!', `Очки: ${levelScore}` + (rec ? ' · Новый рекорд!' : ''), 'Далее', () => {
      if (currentLevel < LEVELS.length - 1) { currentLevel++; startLevel(); }
      else showVictory();
    }, 'win');
  } else if (movesLeft <= 0) {
    sndLose(); showModal('💔 Уровень провален', `Нужно было ${levelTarget}, набрано ${levelScore}`, 'Повторить', () => startLevel(), 'lose');
  } else if (!hasValidMoves()) {
    shuffleGrid();
    processMatches(null);
  } else {
    locked = false;
  }
}

function applyGravity() {
  const falls = [];
  for (let c = 0; c < gridSize; c++) {
    let wr = gridSize - 1;
    for (let r = gridSize - 1; r >= 0; r--) {
      if (grid[r][c] >= 0) {
        if (r !== wr) { falls.push({ r: wr, c, type: grid[r][c], fromR: r }); grid[wr][c] = grid[r][c]; grid[r][c] = -1; }
        wr--;
      }
    }
  }
  return falls;
}

function fillEmpty() {
  for (let r = 0; r < gridSize; r++)
    for (let c = 0; c < gridSize; c++)
      if (grid[r][c] < 0) grid[r][c] = Math.floor(Math.random() * gemTypes);
}

// ======================== RENDERING ========================
function drawBackground() {
  const grd = ctx.createRadialGradient(cw/2, ch/2, 0, cw/2, ch/2, cw*0.75);
  grd.addColorStop(0, 'rgba(212,165,116,0.05)');
  grd.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = grd;
  ctx.fillRect(0, 0, cw, ch);
}

function drawGem(cellC, cellR, type, scale, alpha) {
  if (type < 0 || type >= GEM_COLORS.length) return;
  const x = cellC * cellSize + cellSize / 2;
  const y = cellR * cellSize + cellSize / 2;
  const sz = cellSize * 0.38 * scale;
  ctx.save();
  ctx.globalAlpha = alpha;
  const grad = ctx.createRadialGradient(x - sz*0.3, y - sz*0.3, 0, x, y, sz);
  grad.addColorStop(0, GEM_COLORS[type][0]);
  grad.addColorStop(1, GEM_COLORS[type][1]);
  ctx.fillStyle = grad;
  ctx.shadowColor = 'rgba(0,0,0,0.4)';
  ctx.shadowBlur = 3;

  switch (type) {
    case 0: // circle
      ctx.beginPath(); ctx.arc(x, y, sz, 0, Math.PI*2); ctx.fill(); break;
    case 1: // square
      ctx.fillRect(x - sz, y - sz, sz*2, sz*2); break;
    case 2: // triangle
      ctx.beginPath(); ctx.moveTo(x, y - sz); ctx.lineTo(x + sz, y + sz); ctx.lineTo(x - sz, y + sz); ctx.closePath(); ctx.fill(); break;
    case 3: // diamond
      ctx.beginPath(); ctx.moveTo(x, y - sz); ctx.lineTo(x + sz, y); ctx.lineTo(x, y + sz); ctx.lineTo(x - sz, y); ctx.closePath(); ctx.fill(); break;
    case 4: // star
      drawStar(ctx, x, y, sz, sz*0.45, 5); ctx.fill(); break;
    case 5: // hexagon
      ctx.beginPath();
      for (let i = 0; i < 6; i++) {
        const a = Math.PI/3 * i - Math.PI/6;
        const px = x + Math.cos(a) * sz;
        const py = y + Math.sin(a) * sz;
        i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
      }
      ctx.closePath(); ctx.fill(); break;
  }
  ctx.restore();
}

function drawStar(ctx, cx, cy, outerR, innerR, points) {
  ctx.beginPath();
  for (let i = 0; i < points * 2; i++) {
    const r = i % 2 === 0 ? outerR : innerR;
    const a = Math.PI / points * i - Math.PI / 2;
    const x = cx + Math.cos(a) * r;
    const y = cy + Math.sin(a) * r;
    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  }
  ctx.closePath();
}

function drawCell(c, r) {
  const x = c * cellSize, y = r * cellSize;
  ctx.fillStyle = 'rgba(255,255,255,0.04)';
  ctx.beginPath();
  ctx.roundRect(x + 1, y + 1, cellSize - 2, cellSize - 2, 3);
  ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.03)';
  ctx.lineWidth = 0.5;
  ctx.beginPath();
  ctx.roundRect(x + 1, y + 1, cellSize - 2, cellSize - 2, 3);
  ctx.stroke();
}

function render() {
  if (!cellSize || !cw) return;
  ctx.clearRect(0, 0, cw, ch);
  drawBackground();
  const isAnim = animState === 'anim';

  // Draw cells and gems
  for (let r = 0; r < gridSize; r++) {
    for (let c = 0; c < gridSize; c++) {
      drawCell(c, r);
      if (isAnim && animType === 'swap' && (r === animData.r1 && c === animData.c1 || r === animData.r2 && c === animData.c2)) continue;
      if (isAnim && animType === 'swap_back' && (r === animData.r1 && c === animData.c1 || r === animData.r2 && c === animData.c2)) continue;
      if (isAnim && animType === 'match' && animData.cells.some(m => m.r === r && m.c === c)) {
        const scale = 1 - animProgress;
        const alpha = 1 - animProgress * 0.7;
        if (scale > 0.01) drawGem(c, r, grid[r][c], scale, alpha);
        continue;
      }
      if (isAnim && animType === 'fall') {
        const fall = animData.falls.find(f => f.r === r && f.c === c);
        if (fall) continue;
      }
      if (grid[r][c] >= 0) drawGem(c, r, grid[r][c], 1, 1);
    }
  }

  // Swap animation
  if (isAnim && (animType === 'swap' || animType === 'swap_back')) {
    const { r1, c1, r2, c2 } = animData;
    const t = animType === 'swap' ? animProgress : 1 - animProgress;
    const x1 = c1 * cellSize + cellSize/2 + (c2 - c1) * cellSize * t;
    const y1 = r1 * cellSize + cellSize/2 + (r2 - r1) * cellSize * t;
    const x2 = c2 * cellSize + cellSize/2 + (c1 - c2) * cellSize * t;
    const y2 = r2 * cellSize + cellSize/2 + (r1 - r2) * cellSize * t;
    // draw at interpolated positions
    ctx.save();
    const t1 = grid[r1][c1], t2 = grid[r2][c2];
    drawGemAtPos(x1, y1, t2, 1, 1);
    drawGemAtPos(x2, y2, t1, 1, 1);
    ctx.restore();
  }

  // Fall animation
  if (isAnim && animType === 'fall') {
    for (const f of animData.falls) {
      const fromY = (f.fromR) * cellSize + cellSize/2;
      const toY = f.r * cellSize + cellSize/2;
      const y = fromY + (toY - fromY) * animProgress;
      drawGemAtPos(f.c * cellSize + cellSize/2, y, grid[f.r][f.c], 1, 1);
    }
  }

  // Selection
  if (selectedR >= 0 && selectedC >= 0 && grid[selectedR] && grid[selectedR][selectedC] >= 0) {
    const x = selectedC * cellSize, y = selectedR * cellSize;
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 2;
    ctx.shadowColor = 'rgba(255,255,255,0.5)';
    ctx.shadowBlur = 6;
    ctx.beginPath();
    ctx.roundRect(x + 2, y + 2, cellSize - 4, cellSize - 4, 4);
    ctx.stroke();
    ctx.shadowBlur = 0;
  }
}

function drawGemAtPos(x, y, type, scale, alpha) {
  if (type < 0 || type >= GEM_COLORS.length) return;
  const sz = cellSize * 0.38 * scale;
  ctx.save();
  ctx.globalAlpha = alpha;
  const grad = ctx.createRadialGradient(x - sz*0.3, y - sz*0.3, 0, x, y, sz);
  grad.addColorStop(0, GEM_COLORS[type][0]);
  grad.addColorStop(1, GEM_COLORS[type][1]);
  ctx.fillStyle = grad;
  ctx.shadowColor = 'rgba(0,0,0,0.4)';
  ctx.shadowBlur = 3;
  switch (type) {
    case 0: ctx.beginPath(); ctx.arc(x, y, sz, 0, Math.PI*2); ctx.fill(); break;
    case 1: ctx.fillRect(x - sz, y - sz, sz*2, sz*2); break;
    case 2: ctx.beginPath(); ctx.moveTo(x, y - sz); ctx.lineTo(x + sz, y + sz); ctx.lineTo(x - sz, y + sz); ctx.closePath(); ctx.fill(); break;
    case 3: ctx.beginPath(); ctx.moveTo(x, y - sz); ctx.lineTo(x + sz, y); ctx.lineTo(x, y + sz); ctx.lineTo(x - sz, y); ctx.closePath(); ctx.fill(); break;
    case 4: drawStar(ctx, x, y, sz, sz*0.45, 5); ctx.fill(); break;
    case 5: ctx.beginPath();
      for (let i = 0; i < 6; i++) { const a = Math.PI/3*i-Math.PI/6; const px=x+Math.cos(a)*sz, py=y+Math.sin(a)*sz; i===0?ctx.moveTo(px,py):ctx.lineTo(px,py); }
      ctx.closePath(); ctx.fill(); break;
  }
  ctx.restore();
}

// ======================== HUD ========================
function updateHUD() {
  levelNum.textContent = currentLevel + 1;
  totalScoreEl.textContent = totalScore.toLocaleString('ru-RU');
  levelScoreEl.textContent = levelScore.toLocaleString('ru-RU') + ' / ' + levelTarget.toLocaleString('ru-RU');
  movesLeftEl.textContent = movesLeft;
  movesLeftEl.classList.toggle('low', movesLeft <= 5);
  const pct = Math.min(levelScore / levelTarget * 100, 100);
  progressFill.style.width = pct + '%';
}

function showModal(title, score, btnText, onClick, cls) {
  modalTitle.textContent = title;
  modalScore.textContent = score;
  modalBtn.textContent = btnText;
  modalBtn.onclick = onClick;
  modalBtn2.classList.add('hidden');
  modalEl.className = cls === 'win' ? 'modal-win' : 'modal-lose';
  modalEl.classList.remove('hidden');
}

function showVictory() {
  modalTitle.textContent = '🏆 Победа!';
  modalScore.textContent = 'Все 15 уровней пройдены! Общий счёт: ' + totalScore.toLocaleString('ru-RU');
  modalBtn.textContent = 'Сыграть снова';
  modalBtn.onclick = () => { currentLevel = 0; totalScore = 0; localStorage.removeItem(SAVE_KEY); startLevel(); };
  modalBtn2.classList.add('hidden');
  modalEl.className = 'modal-win';
  modalEl.classList.remove('hidden');
}

function askConfirm(title, text, onYes) {
  modalTitle.textContent = title;
  modalScore.textContent = text;
  modalBtn.textContent = 'Да, заново';
  modalBtn2.textContent = 'Отмена';
  modalBtn.onclick = () => { modalEl.classList.add('hidden'); onYes(); };
  modalBtn2.onclick = () => modalEl.classList.add('hidden');
  modalBtn2.classList.remove('hidden');
  modalEl.className = 'modal-ask';
  modalEl.classList.remove('hidden');
}

// ======================== CANVAS SIZING ========================
if (!CanvasRenderingContext2D.prototype.roundRect) {
  CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
    if (r > w/2) r = w/2; if (r > h/2) r = h/2;
    this.moveTo(x + r, y); this.lineTo(x + w - r, y);
    this.quadraticCurveTo(x + w, y, x + w, y + r);
    this.lineTo(x + w, y + h - r);
    this.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    this.lineTo(x + r, y + h);
    this.quadraticCurveTo(x, y + h, x, y + h - r);
    this.lineTo(x, y + r);
    this.quadraticCurveTo(x, y, x + r, y);
  };
}

function resizeCanvas() {
  const wrap = document.getElementById('canvas-wrap');
  const wrapH = wrap.clientHeight;
  if (wrapH < 50 || gridSize < 3) return;
  const avail = Math.min(wrap.clientWidth - 24, wrapH - 24);
  cellSize = Math.floor(avail / gridSize);
  cw = cellSize * gridSize;
  ch = cellSize * gridSize;
  canvas.width = cw * dpr;
  canvas.height = ch * dpr;
  canvas.style.width = cw + 'px';
  canvas.style.height = ch + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

// ======================== INPUT ========================
function getGridCell(clientX, clientY) {
  const rect = canvas.getBoundingClientRect();
  const x = clientX - rect.left;
  const y = clientY - rect.top;
  const c = Math.floor(x / cellSize);
  const r = Math.floor(y / cellSize);
  if (r < 0 || r >= gridSize || c < 0 || c >= gridSize) return null;
  return { r, c };
}

let touchStartR = -1, touchStartC = -1, touchStartX = 0, touchStartY = 0, hasSwiped = false;

canvas.addEventListener('touchstart', (e) => {
  e.preventDefault();
  initAudio();
  if (locked || animState !== 'idle') return;
  const t = e.touches[0];
  const cell = getGridCell(t.clientX, t.clientY);
  if (!cell) return;
  touchStartR = cell.r; touchStartC = cell.c;
  touchStartX = t.clientX; touchStartY = t.clientY;
  hasSwiped = false;
});

canvas.addEventListener('touchmove', (e) => {
  e.preventDefault();
  if (hasSwiped || locked || animState !== 'idle') return;
  const t = e.touches[0];
  const dx = t.clientX - touchStartX, dy = t.clientY - touchStartY;
  const thresh = cellSize * 0.3;
  if (Math.abs(dx) > thresh || Math.abs(dy) > thresh) {
    let dr = 0, dc = 0;
    if (Math.abs(dx) > Math.abs(dy)) dc = dx > 0 ? 1 : -1;
    else dr = dy > 0 ? 1 : -1;
    const nr = touchStartR + dr, nc = touchStartC + dc;
    if (nr >= 0 && nr < gridSize && nc >= 0 && nc < gridSize) {
      sndClick();
      doSwap(touchStartR, touchStartC, nr, nc);
    }
    hasSwiped = true; selectedR = -1; selectedC = -1;
  }
});

canvas.addEventListener('touchend', (e) => {
  e.preventDefault();
  if (locked) return;
  if (!hasSwiped && touchStartR >= 0 && animState === 'idle') {
    if (selectedR === touchStartR && selectedC === touchStartC) {
      selectedR = -1; selectedC = -1;
    } else if (selectedR >= 0 && Math.abs(selectedR - touchStartR) + Math.abs(selectedC - touchStartC) === 1) {
      sndClick();
      doSwap(selectedR, selectedC, touchStartR, touchStartC);
      selectedR = -1; selectedC = -1;
    } else {
      selectedR = touchStartR; selectedC = touchStartC;
    }
  }
  touchStartR = -1;
});

// Mouse support for desktop testing
canvas.addEventListener('mousedown', (e) => {
  initAudio();
  if (locked || animState !== 'idle') return;
  const cell = getGridCell(e.clientX, e.clientY);
  if (!cell) return;
  if (selectedR === cell.r && selectedC === cell.c) {
    selectedR = -1; selectedC = -1;
  } else if (selectedR >= 0 && Math.abs(selectedR - cell.r) + Math.abs(selectedC - cell.c) === 1) {
    sndClick();
    doSwap(selectedR, selectedC, cell.r, cell.c);
    selectedR = -1; selectedC = -1;
  } else {
    selectedR = cell.r; selectedC = cell.c;
  }
});

// ======================== GAME LOOP ========================
function loop() {
  updateAnim();
  render();
  requestAnimationFrame(loop);
}

// ======================== INIT ========================
loadGame();
const sndBtn = document.getElementById('btn-sound');
sndBtn.textContent = soundOn ? '🔊' : '🔇';
const bestOnLoad = getBest();
if (bestOnLoad > 0) {
  const bestEl = document.getElementById('welcome-best');
  bestEl.querySelector('b').textContent = bestOnLoad.toLocaleString('ru-RU');
  bestEl.classList.remove('hidden');
}
document.getElementById('btn-play').onclick = () => {
  initAudio();
  welcomeEl.style.display = 'none';
  startLevel();
};
document.getElementById('btn-new').onclick = () => {
  askConfirm('Начать заново?', 'Текущий прогресс и счёт будут сброшены.', () => {
    currentLevel = 0; totalScore = 0; localStorage.removeItem(SAVE_KEY); startLevel();
  });
};
document.getElementById('btn-retry').onclick = () => startLevel();
sndBtn.onclick = function() {
  soundOn = !soundOn;
  this.textContent = soundOn ? '🔊' : '🔇';
  try { localStorage.setItem(SND_KEY, soundOn ? '1' : '0'); } catch (e) {}
};
window.addEventListener('resize', () => {
  if (gameEl.classList.contains('hidden')) return;
  resizeCanvas();
});
loop();
</script>
