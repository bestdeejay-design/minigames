<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
  <title>Рулетка — мини-игра | AXIIOM</title>
  <meta name="description" content="Рулетка без риска: делайте ставки фишками, крутите колесо и изучайте шансы. Демо-мини-игра от AXIIOM.">
  <link rel="canonical" href="https://bestdeejay-design.github.io/minigames/roulette/">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://bestdeejay-design.github.io/minigames/roulette/">
  <meta property="og:title" content="Рулетка — мини-игра | AXIIOM">
  <meta property="og:description" content="Рулетка без риска: делайте ставки фишками, крутите колесо и изучайте шансы. Демо-мини-игра от AXIIOM.">
  <meta property="og:image" content="https://axiiom.ru/og-image.png">
  <meta property="og:locale" content="ru_RU">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Рулетка — мини-игра | AXIIOM">
  <meta name="twitter:description" content="Рулетка без риска: делайте ставки фишками, крутите колесо и изучайте шансы. Демо-мини-игра от AXIIOM.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='28' font-size='28'>🎰</text></svg>">
  <meta name="theme-color" content="#0A0A0F">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="grid-overlay"></div>
<div class="noise"></div>
<div id="app">
  <header id="topbar">
    <a class="back" href="../">← Каталог</a>
    <span class="brand">AXIIOM</span>
  </header>
  <div id="hud">
    <span>💰 <span id="balance">1000</span></span>
    <span>🎲 <span id="bet-total">0</span></span>
    <button id="btn-mute" aria-label="Звук">🔊</button>
    <span id="result-label"></span>
  </div>
  <canvas id="gameCanvas"></canvas>
  <div id="betting">
    <div id="num-grid"></div>
    <div id="outside-bets">
      <button data-bet="1-18">1-18</button>
      <button data-bet="19-36">19-36</button>
      <button data-bet="red" class="b-red">Красное</button>
      <button data-bet="black" class="b-black">Чёрное</button>
      <button data-bet="odd">Нечёт</button>
      <button data-bet="even">Чёт</button>
    </div>
    <div id="chip-row">
      <span>Ставка:</span>
      <button class="chip-btn active" data-val="10">10</button>
      <button class="chip-btn" data-val="25">25</button>
      <button class="chip-btn" data-val="100">100</button>
      <button id="btn-clear">✕</button>
      <button id="btn-spin">КРУТИТЬ!</button>
    </div>
  </div>
  <div id="overlay" class="hidden">
    <div class="modal-card">
      <div id="overlay-title"></div>
      <div id="overlay-sub"></div>
      <button id="btn-next">Ещё!</button>
    </div>
  </div>
</div>
  <div id="toast-container"></div>
<script src="game.js"></script>
</body>
</html>
